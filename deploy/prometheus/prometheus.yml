# AC-41: scrape every service's /metrics endpoint every 5s. Committed so Grafana's
# provisioned dashboard has data with no manual setup (AC-42).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: engine
    metrics_path: /metrics
    static_configs:
      - targets: ["engine:8080"]

  - job_name: campaign-app
    metrics_path: /metrics
    static_configs:
      - targets: ["campaign-app:8000"]

  - job_name: win-notifier
    metrics_path: /metrics
    static_configs:
      - targets: ["win-notifier:8010"]

  - job_name: topup-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["topup-worker:8090"]

# NOTE: `mock-exchange` is deliberately NOT scraped. It is a one-shot job gated behind the
# compose `demo` profile, so it is absent except during a run — scraping it would leave a
# permanently-down target and make "all targets up" unassertable (AC-41). Its counters are
# printed in the run summary, and its effects are visible via the engine and win-notifier
# metrics plus the Redis stats hashes.
