[workspace]
resolver = "2"
members = ["crates/filters", "crates/wire", "crates/budget", "crates/configstore", "crates/engine"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
# Versions verified against crates.io on 2026-08-22. Pinned so drift is detectable.
axum        = "0.8.9"
tokio       = { version = "1", features = ["full"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
sqlx        = { version = "0.8", features = ["runtime-tokio", "postgres", "macros"], default-features = false }   # NOTE: 0.9.0 requires rustc 1.94; this toolchain is 1.93.1
redis       = { version = "1.6.0", features = ["tokio-comp", "script"] }
arc-swap    = "1.8.2"   # NOTE: crates.io max is 1.8.2; the plan cited 1.9.2, which does not exist
fixedbitset = "0.5.7"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow      = "1"
thiserror   = "2"
uuid        = { version = "1", features = ["v4", "fast-rng"] }
iab-specs   = { version = "0.5.1", features = ["openrtb_26"] }   # 2.6 is additive over 2.5 on the same v25 types
